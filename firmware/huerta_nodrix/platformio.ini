[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

upload_port = COM7
monitor_port = COM7

lib_deps =
    decoded-cipher/Nodrix
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
